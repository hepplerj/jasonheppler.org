<header class="bf-header">
  <a href="/" class="bf-wordmark" aria-label="Jason A. Heppler — home">
    <svg class="bf-brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="120" cy="120" r="112"/>
        <path d="M92 60 L92 160 Q92 185 65 179"/>
        <line x1="152" y1="60" x2="152" y2="153"/>
        <line x1="92" y1="103" x2="152" y2="103"/>
      </g>
    </svg>
    <span class="bf-wordmark-name">Jason A. Heppler</span>
  </a>
  <button class="bf-nav-toggle lm-nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="lmNav">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <nav class="bf-nav ba-nav-cols" id="lmNav">
    <div class="ba-nav-col">
      <a href="/archive/"{{ if or (in (slice "blog" "microblog") .Section) (eq .RelPermalink "/archive/") }} class="bf-nav-active"{{ end }}>Writing</a>
      <a href="/publications/"{{ if eq .Section "publications" }} class="bf-nav-active"{{ end }}>Publications</a>
    </div>
    <div class="ba-nav-col">
      <a href="/research/"{{ if or (eq .Section "projects") (eq .RelPermalink "/research/") }} class="bf-nav-active"{{ end }}>Digital History</a>
      <a href="/books/"{{ if eq .Section "books" }} class="bf-nav-active"{{ end }}>Bookshelf</a>
    </div>
    <div class="ba-nav-col">
      <a href="/about/"{{ if eq .RelPermalink "/about/" }} class="bf-nav-active"{{ end }}>About</a>
    </div>
    <button class="lm-theme" type="button" aria-label="Switch color theme (auto, light, dark)" title="Theme">
      <svg class="lm-ic-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3 A9 9 0 0 0 12 21 Z" fill="currentColor" stroke="none"/>
      </svg>
      <svg class="lm-ic-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="lm-ic-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8 8 0 1 1 9.5 4 6.3 6.3 0 0 0 20 14.5Z"/>
      </svg>
    </button>
    <button class="lm-accent" type="button" aria-label="Change accent color" title="Accent color">
      <span class="lm-accent-dot" aria-hidden="true"></span>
    </button>
  </nav>
</header>
